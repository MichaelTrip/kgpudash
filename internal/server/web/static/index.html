<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kgpudash — Kubernetes GPU Dashboard</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <!-- Custom overrides -->
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- ── Navbar ──────────────────────────────────────────────────────────── -->
  <nav class="navbar kgpu-navbar sticky-top">
    <div class="container-fluid px-3">

      <!-- Brand -->
      <a class="navbar-brand kgpu-brand d-flex align-items-center gap-2 me-3" href="#">
        <i class="bi bi-gpu-card"></i>
        <span>kgpudash</span>
      </a>

      <!-- Cluster pill -->
      <span class="kgpu-cluster-badge me-auto" id="cluster-label">
        <i class="bi bi-hdd-network me-1"></i>connecting…
      </span>

      <!-- Right side -->
      <div class="d-flex align-items-center gap-2">
        <!-- GPU count -->
        <span class="kgpu-gpu-badge" id="gpu-count">
          <i class="bi bi-gpu-card me-1"></i>0 GPUs
        </span>

        <!-- WS status -->
        <span class="kgpu-ws-dot" id="ws-status" title="Disconnected">
          <i class="bi bi-circle-fill"></i>
        </span>

        <!-- Theme toggle -->
        <button class="btn btn-sm kgpu-theme-btn" id="theme-toggle" title="Toggle light/dark">
          <i class="bi bi-moon-stars-fill" id="theme-icon"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- ── Filter bar ───────────────────────────────────────────────────────── -->
  <div class="kgpu-filterbar border-bottom">
    <div class="container-fluid px-3 py-1 d-flex flex-wrap align-items-center gap-3">

      <div class="d-flex align-items-center gap-2">
        <label class="kgpu-filter-label" for="filter-vendor">
          <i class="bi bi-funnel me-1"></i>Vendor
        </label>
        <select class="form-select form-select-sm kgpu-select" id="filter-vendor">
          <option value="">All Vendors</option>
          <option value="nvidia">NVIDIA</option>
          <option value="amd">AMD</option>
          <option value="intel">Intel</option>
        </select>
      </div>

      <div class="d-flex align-items-center gap-2">
        <label class="kgpu-filter-label" for="filter-node">
          <i class="bi bi-server me-1"></i>Node
        </label>
        <select class="form-select form-select-sm kgpu-select" id="filter-node">
          <option value="">All Nodes</option>
        </select>
      </div>

      <div class="d-flex align-items-center gap-2">
        <label class="kgpu-filter-label" for="filter-pod">
          <i class="bi bi-search me-1"></i>Pod
        </label>
        <input type="text" class="form-control form-control-sm kgpu-input"
               id="filter-pod" placeholder="Search pod…" />
      </div>

    </div>
  </div>

  <!-- ── Main content ─────────────────────────────────────────────────────── -->
  <main class="container-fluid px-3 py-3 kgpu-main" id="main-grid">

    <!-- Empty state -->
    <div class="kgpu-empty" id="empty-state">
      <i class="bi bi-gpu-card display-3 mb-3 opacity-25"></i>
      <p class="text-muted">Waiting for GPU data…</p>
    </div>

  </main>

  <!-- ── History panel ────────────────────────────────────────────────────── -->
  <div class="kgpu-history-panel" id="history-panel">
    <div class="kgpu-history-header d-flex align-items-center gap-3 px-4 py-2 border-bottom">
      <i class="bi bi-graph-up-arrow kgpu-history-icon"></i>
      <span class="kgpu-history-title flex-grow-1" id="history-title">GPU History</span>

      <!-- Range buttons -->
      <div class="btn-group btn-group-sm" role="group">
        <button class="btn kgpu-range-btn active" data-range="3600000">1h</button>
        <button class="btn kgpu-range-btn" data-range="21600000">6h</button>
        <button class="btn kgpu-range-btn" data-range="86400000">24h</button>
        <button class="btn kgpu-range-btn" data-range="604800000">7d</button>
      </div>

      <button class="btn btn-sm kgpu-close-btn" id="history-close">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="kgpu-history-charts row g-2 px-4 py-2 flex-nowrap">
      <div class="col kgpu-chart-col">
        <div class="kgpu-chart-card h-100">
          <div class="kgpu-chart-label">
            <i class="bi bi-activity me-1 text-util"></i>Utilization %
          </div>
          <canvas id="chart-util"></canvas>
        </div>
      </div>
      <div class="col kgpu-chart-col">
        <div class="kgpu-chart-card h-100">
          <div class="kgpu-chart-label">
            <i class="bi bi-memory me-1 text-vram"></i>VRAM Used (MB)
          </div>
          <canvas id="chart-vram"></canvas>
        </div>
      </div>
      <div class="col kgpu-chart-col">
        <div class="kgpu-chart-card h-100">
          <div class="kgpu-chart-label">
            <i class="bi bi-thermometer-half me-1 text-temp"></i>Temperature (°C)
          </div>
          <canvas id="chart-temp"></canvas>
        </div>
      </div>
      <div class="col kgpu-chart-col">
        <div class="kgpu-chart-card h-100">
          <div class="kgpu-chart-label">
            <i class="bi bi-lightning-charge me-1 text-power"></i>Power (W)
          </div>
          <canvas id="chart-power"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <!-- App -->
  <script src="/app.js"></script>
</body>
</html>
