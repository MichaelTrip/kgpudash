---
# Service for the kgpudash-server web dashboard.
# Change type to LoadBalancer or add an Ingress for external access.
apiVersion: v1
kind: Service
metadata:
  name: kgpudash-server
  namespace: kgpudash
  labels:
    app: kgpudash-server
spec:
  selector:
    app: kgpudash-server
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP

---
# Headless service for agent-to-server gRPC discovery.
# The server uses this to find agent pod IPs.
apiVersion: v1
kind: Service
metadata:
  name: kgpudash-agent
  namespace: kgpudash
  labels:
    app: kgpudash-agent
spec:
  selector:
    app: kgpudash-agent
  clusterIP: None
  ports:
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP

